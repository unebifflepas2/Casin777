        :root {
            --primary: #E63946; /* Rouge plus vif */
            --primary-dim: rgba(230, 57, 70, 0.2);

        * { margin: 0; padding: 0; box-sizing: border-box; scroll-behavior: smooth; }
        body { 
            font-family: 'DM Sans', sans-serif; 
            color: var(--text-main); 
            background-color: var(--bg-black);
            line-height: 1.6; 
            overflow-x: hidden;
            position: relative;
        }

        /* Style pour masquer l'Iframe de musique tout en garantissant sa lecture */
        .bg-music-stream {
            position: absolute;
            width: 1px;
            height: 1px;

            border: 0;
            opacity: 0;
            pointer-events: none;

        /* Canvas pour les particules en arrière-plan */

            position: fixed;

            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none; /* Laisse cliquer à travers */
        }

        /* Forcer le contenu à être au-dessus du canvas */
        header, section, main, footer {
            position: relative;
            z-index: 2;
        }

        /* Barre de navigation */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;

            z-index: 100;
            border-bottom: 1px solid var(--border);

        .logo {

        .nav-links {

        /* Boutons de style Pro (Forme angulaire + Typo Orbitron + Lueur) */
        .btn {

            cursor: pointer;
            border: none;

            width: 50px;
            height: 3px;
            background: var(--primary);
            margin: 15px auto;
        }

            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 30px;
        }

            background: var(--bg-card);
            border-radius: 20px;
            border: 1px solid var(--border);
            overflow: hidden;
            user-select: none;

        .profile-img { 
            width: 120px; 
            height: 120px; 
            border-radius: 50%; 
            padding: 0;
            object-fit: cover;
        }
        .footer-name { 
            font-family: 'Orbitron', sans-serif;
            font-size: 1.8rem; 
            margin-bottom: 5px; 
            letter-spacing: 1px;
        }
        
        /* Alignement boutons de contact */
        .footer-actions {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            max-width: 320px;
            margin: 0 auto;
        }
        .footer-actions .btn {
            width: 100%;
        }

        .btn-link-img {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 12px 45px;
            border-radius: 50px; /* Retour aux coins arrondis style pilule */
            background: #ffffff;

            border: none;
            transition: all 0.4s ease;
        }
        .btn-link-img:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 30px rgba(255,255,255,0.1);
            background: #ffffff;
        }
        .btn-link-img img {
            max-height: 45px; /* Taille d'origine */
            width: auto;
            object-fit: contain;
            filter: grayscale(100%);
            transition: filter 0.4s ease, transform 0.4s ease;
        }
        .btn-link-img:hover img {
            filter: grayscale(0%);
        }

    <script>
        const canvas = document.getElementById('bg-particles');
        const ctx = canvas.getContext('2d');

        let particlesArray = [];
        const numberOfParticles = 45;

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        class Particle {
            constructor() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.size = Math.random() * 2 + 0.5;
                this.speedX = Math.random() * 0.4 - 0.2;
                this.speedY = Math.random() * 0.4 - 0.2;
                this.opacity = Math.random() * 0.5 + 0.2;
            }
            update() {
                this.x += this.speedX;
                this.y += this.speedY;

                if (this.x > canvas.width) this.x = 0;
                else if (this.x < 0) this.x = canvas.width;
                if (this.y > canvas.height) this.y = 0;
                else if (this.y < 0) this.y = canvas.height;
            }
            draw() {
                ctx.fillStyle = `rgba(230, 57, 70, ${this.opacity})`;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        function init() {
            particlesArray = [];
            for (let i = 0; i < numberOfParticles; i++) {
                particlesArray.push(new Particle());
            }
        }

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            for (let i = 0; i < particlesArray.length; i++) {
                particlesArray[i].update();
                particlesArray[i].draw();
            }
            requestAnimationFrame(animate);
        }

        init();
        animate();
    </script>
